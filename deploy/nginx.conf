# DSA 反向代理配置
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/dsa.conf
#   sudo sed -i 's/dsa.example.com/你的域名/' /etc/nginx/conf.d/dsa.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS（certbot 会自动改写本文件并配置自动续期）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名
#
# 安全组只需放行 22 / 80 / 443，不要暴露 8000。

server {
    listen 80;
    server_name dsa.example.com;

    # 「设置 → 从图片添加」需要上传图片（单张最大 5MB）。
    # nginx 默认上限 1MB，不放宽会导致该功能一直失败。
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent 对话页依赖 WebSocket，删掉这两行会让对话页不可用
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 全市场分析 / Agent 流式输出耗时长，默认 60s 会被截断
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 关闭缓冲，保证 Agent 流式输出实时到达浏览器
        proxy_buffering off;
    }
}
