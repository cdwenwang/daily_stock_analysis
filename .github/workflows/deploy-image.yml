name: Build Deploy Image

# fork 专用：main 分支更新后构建「你自己的」部署镜像，同时推送到 GHCR 和阿里云 ACR。
# 与仓库自带的 docker-publish.yml（官方发版，v*.*.* tag 触发）互不干扰。
#
# 为什么推两份：
#   GHCR 是构建产物的原始归属地，但它依赖 *.githubusercontent.com 分发 blob，
#   国内 ECS 拉取时 TCP 能连上却零传输（实测卡死）。ACR 走阿里云内网，秒级。
#   保留 GHCR 只是留一条后路，ECS 实际从 ACR 拉。
#
# 前置条件（fork 不会自动开启，需要手动设置一次）：
#   1) Settings → Actions → General → Workflow permissions
#      选 "Read and write permissions"，否则 GITHUB_TOKEN 没有 packages:write 权限。
#   2) 添加两个 Repository secrets（Settings → Secrets and variables → Actions）：
#      ACR_USERNAME = 阿里云账号全名（如 1179574672@qq.com）
#      ACR_PASSWORD = ACR「访问凭证」页设置的固定密码
#
# GHCR 包首次推送后如需匿名拉取，把可见性改为 Public：
#   https://github.com/users/cdwenwang/packages/container/daily_stock_analysis/settings

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'deploy/**'
      - '.github/workflows/deploy-image.yml'
  workflow_dispatch:

concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # ACR 这里必须用公网地址：GitHub 的 runner 在国外，解析不到 VPC 内网端点。
  # ECS 侧用 -vpc 端点拉取，见 deploy/docker-compose.prod.yml。
  ACR_REGISTRY: crpi-u3rv49hccjew63jz.cn-beijing.personal.cr.aliyuncs.com
  ACR_IMAGE: crpi-u3rv49hccjew63jz.cn-beijing.personal.cr.aliyuncs.com/default-is/stock-analysis

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          # ECS 是 ARM 实例（阿里云倚天 / 腾讯云 ARM）时改成 linux/amd64,linux/arm64，
          # 同时上面的 buildx 步骤需要 docker/setup-qemu-action@v3。
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.ACR_IMAGE }}:prod
            ${{ env.ACR_IMAGE }}:sha-${{ github.sha }}
          # 必须关掉：buildx 默认会额外生成 provenance/SBOM 证明清单（mediaType
          # application/vnd.oci.empty.v1+json），GHCR 接受，但阿里云 ACR 个人版会拒绝，
          # 报 "denied: unknown manifest class for application/vnd.oci.empty.v1+json"。
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 直接拉取刚推送的镜像做导入冒烟，确保 ECS 上拉到的东西真的能跑起来。
      # 用 heredoc 而非 python -c "多行"，避免缩进被当成 IndentationError。
      - name: Smoke test pushed image
        run: |
          docker run --rm -i --entrypoint python "${{ env.IMAGE }}:sha-${{ github.sha }}" - <<'PY'
          from src.config import get_config
          print('ok-config')
          from src.storage import DatabaseManager
          print('ok-storage')
          from src.notification import NotificationService
          print('ok-notification')
          from data_provider import DataFetcherManager
          print('ok-data-provider')
          from src.analyzer import GeminiAnalyzer
          print('ok-analyzer')
          print('smoke-ok')
          PY

      - name: Summary
        run: |
          {
            echo "### 部署镜像已发布"
            echo ""
            echo "**阿里云 ACR（ECS 从这里拉，内网端点）**"
            echo "- \`${{ env.ACR_IMAGE }}:prod\`"
            echo "- \`${{ env.ACR_IMAGE }}:sha-${{ github.sha }}\`"
            echo ""
            echo "**GHCR（备份，国内不可用）**"
            echo "- \`${{ env.IMAGE }}:prod\`"
            echo "- \`${{ env.IMAGE }}:sha-${{ github.sha }}\`"
            echo ""
            echo "ECS 上线：\`dsa-up\`"
            echo "回滚到本版本：把 deploy/docker-compose.prod.yml 的 tag 改成 \`:sha-${{ github.sha }}\` 后重新 \`dsa-up\`"
          } >> "$GITHUB_STEP_SUMMARY"
